version: '3.8'
services:
  ollama:
    build:
      context: .
      dockerfile: Dockerfile.ollama
    ports: ["11434:11434"]
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  api:
    build: ./backend
    ports: ["8000:8000"]
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./backend/static:/app/static
    environment:
      - PYTHONWARNINGS=ignore::UserWarning

  web:
    build: ./frontend
    ports: ["3000:3000"]

volumes:
  ollama_data: